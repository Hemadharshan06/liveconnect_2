
<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>LiveConnect Analytics</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
        }

        .webinar-info {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(180px, 1fr)
            );
            gap: 15px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .card-title {
            font-size: 15px;
            margin-bottom: 10px;
        }

        .card-value {
            font-size: 30px;
            font-weight: bold;
        }

        .section {
            background: white;
            margin-top: 25px;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .bar-container {
            margin: 15px 0;
        }

        .bar-label {
            margin-bottom: 5px;
            font-weight: bold;
        }

        .bar {
            height: 30px;
            background: #e9ecef;
            border-radius: 6px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: #4f7cff;
            width: 0%;
            color: white;
            display: flex;
            align-items: center;
            padding-left: 10px;
            box-sizing: border-box;
        }

        .button-container {
            text-align: center;
            margin-top: 30px;
        }

        button {
            padding: 12px 22px;
            font-size: 16px;
            cursor: pointer;
            margin: 5px;
        }

        #errorMessage {
            text-align: center;
            color: red;
            margin: 20px;
        }

    </style>

</head>


<body>


    <h1>
        📊 Webinar Analytics
    </h1>


    <div
        id="errorMessage"
    >
    </div>


    <div class="webinar-info">

        <h2>
            LiveConnect Webinar
        </h2>


        <div>
            Webinar ID:
            <strong id="webinarIdDisplay">
                -
            </strong>
        </div>

    </div>


    <!-- =====================================================
         ANALYTICS CARDS
         ===================================================== -->

    <div class="cards">


        <div class="card">

            <div class="card-title">
                Participants
            </div>

            <div
                id="participants"
                class="card-value"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Peak Participants
            </div>

            <div
                id="peakParticipants"
                class="card-value"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Messages
            </div>

            <div
                id="messages"
                class="card-value"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Questions
            </div>

            <div
                id="questions"
                class="card-value"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Poll Responses
            </div>

            <div
                id="pollResponses"
                class="card-value"
            >
                0
            </div>

        </div>


        <div class="card">

            <div class="card-title">
                Reactions
            </div>

            <div
                id="reactions"
                class="card-value"
            >
                0
            </div>

        </div>


    </div>


    <!-- =====================================================
         PARTICIPANT CHART
         ===================================================== -->

    <div class="section">

        <h2>
            Participants
        </h2>


        <div class="bar-container">

            <div class="bar-label">
                Total Participants
            </div>


            <div class="bar">

                <div
                    id="participantBar"
                    class="bar-fill"
                >
                    0
                </div>

            </div>

        </div>

    </div>


    <!-- =====================================================
         POLL RESULTS
         ===================================================== -->

    <div class="section">

        <h2>
            Poll Results
        </h2>


        <div id="pollResults">

            No poll results available.

        </div>

    </div>


    <!-- =====================================================
         BUTTONS
         ===================================================== -->

    <div class="button-container">


        <button
            onclick="startNewWebinar()"
        >
            Start New Webinar
        </button>


        <button
            onclick="goToHost()"
        >
            Back to Host
        </button>

    </div>


    <script>


        // ====================================================
        // PHP BACKEND
        // ====================================================

        const PHP_BASE_URL =
            "http://localhost/liveconnect-api";


        // ====================================================
        // GET WEBINAR ID
        // ====================================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const webinarId =
            params.get(
                "webinar_id"
            );


        document.getElementById(
            "webinarIdDisplay"
        ).textContent =
            webinarId || "-";


        // ====================================================
        // LOAD ANALYTICS
        // ====================================================

        async function loadAnalytics() {


            if (
                !webinarId
            ) {

                document.getElementById(
                    "errorMessage"
                ).textContent =
                    "Webinar ID not found.";

                return;

            }


            try {


                const response =
                    await fetch(
                        `${PHP_BASE_URL}/analytics.php?webinar_id=${encodeURIComponent(webinarId)}`
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to load analytics."
                    );

                }


                document.getElementById(
                    "participants"
                ).textContent =
                    data.participants;


                document.getElementById(
                    "peakParticipants"
                ).textContent =
                    data.peak_participants;


                document.getElementById(
                    "messages"
                ).textContent =
                    data.messages;


                document.getElementById(
                    "questions"
                ).textContent =
                    data.questions;


                document.getElementById(
                    "pollResponses"
                ).textContent =
                    data.poll_responses;


                document.getElementById(
                    "reactions"
                ).textContent =
                    data.reactions;


                // --------------------------------------------
                // Participant bar
                // --------------------------------------------

                const participantBar =
                    document.getElementById(
                        "participantBar"
                    );


                const participantValue =
                    Number(
                        data.participants
                    );


                const barWidth =
                    participantValue > 0
                        ? Math.min(
                            participantValue * 20,
                            100
                        )
                        : 0;


                participantBar.style.width =
                    `${barWidth}%`;


                participantBar.textContent =
                    participantValue;


            }
            catch (error) {


                document.getElementById(
                    "errorMessage"
                ).textContent =
                    "Unable to load analytics.";

                console.error(
                    error
                );

            }

        }


        // ====================================================
        // LOAD POLL RESULTS
        // ====================================================

        async function loadPollResults() {


            if (
                !webinarId
            ) {

                return;

            }


            try {


                const response =
                    await fetch(
                        `${PHP_BASE_URL}/analytics.php?webinar_id=${encodeURIComponent(webinarId)}`
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    throw new Error(
                        data.message ||
                        "Unable to load poll results."
                    );

                }


                const container =
                    document.getElementById(
                        "pollResults"
                    );


                container.innerHTML =
                    "";


                if (
                    !data.polls
                    || data.polls.length === 0
                ) {

                    container.textContent =
                        "No poll results available.";

                    return;

                }


                data.polls.forEach(
                    function(poll) {


                        const question =
                            document.createElement(
                                "h3"
                            );


                        question.textContent =
                            poll.question;


                        container.appendChild(
                            question
                        );


                        let maximumVotes = 0;


                        poll.options.forEach(
                            function(option) {

                                maximumVotes =
                                    Math.max(
                                        maximumVotes,
                                        option.votes
                                    );

                            }
                        );


                        poll.options.forEach(
                            function(option) {


                                const wrapper =
                                    document.createElement(
                                        "div"
                                    );


                                wrapper.className =
                                    "bar-container";


                                const label =
                                    document.createElement(
                                        "div"
                                    );


                                label.className =
                                    "bar-label";


                                label.textContent =
                                    `${option.option_text || option.option}: ${option.votes} vote(s)`;


                                const bar =
                                    document.createElement(
                                        "div"
                                    );


                                bar.className =
                                    "bar";


                                const fill =
                                    document.createElement(
                                        "div"
                                    );


                                fill.className =
                                    "bar-fill";


                                let width = 0;


                                if (
                                    maximumVotes > 0
                                ) {

                                    width =
                                        (
                                            option.votes
                                            /
                                            maximumVotes
                                        ) * 100;

                                }


                                fill.style.width =
                                    `${width}%`;


                                fill.textContent =
                                    option.votes;


                                bar.appendChild(
                                    fill
                                );


                                wrapper.appendChild(
                                    label
                                );


                                wrapper.appendChild(
                                    bar
                                );


                                container.appendChild(
                                    wrapper
                                );

                            }
                        );

                    }
                );


            }
            catch (error) {

                console.error(
                    error
                );

            }

        }


        // ====================================================
        // START NEW WEBINAR
        // ====================================================

        function startNewWebinar() {
    localStorage.removeItem(
        "liveconnect_webinar_id"
    );

    localStorage.removeItem(
        "liveconnect_webinar_title"
    );

    localStorage.removeItem(
        "liveconnect_join_code"
    );

    window.location.href =
        "/liveconnect/host.html?new=1";
}

        // ====================================================
        // BACK TO HOST
        // ====================================================

        function goToHost() {

            window.location.href =
               "/liveconnect/host.html";

        }


        // ====================================================
        // LOAD
        // ====================================================

        loadAnalytics();

        loadPollResults();

    </script>


</body>

</html>
