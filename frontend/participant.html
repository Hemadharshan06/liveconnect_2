<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>LiveConnect - Participant</title>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
>

<link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
>

<style>

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

    font-family:
        Arial,
        sans-serif;

    background: #111827;
}

#joinSection {

    height: 100vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 20px;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1e3a8a
        );
}

.join-card {

    width: 100%;

    max-width: 440px;

    background: white;

    border-radius: 16px;

    padding: 35px;

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.3);
}

#webinarSection {

    height: 100vh;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}

.topbar {

    height: 64px;

    flex-shrink: 0;

    background: #1f2937;

    border-bottom:
        1px solid #374151;

    color: white;

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding:
        0 18px;
}

.brand {

    font-size: 21px;

    font-weight: bold;

    display: flex;

    align-items: center;

    gap: 8px;
}

.brand i {

    color: #3b82f6;
}

.live {

    background: #dc2626;

    color: white;

    padding:
        8px 11px;

    border-radius: 6px;

    font-weight: bold;

    font-size: 12px;
}

.main {

    flex: 1;

    min-height: 0;

    display: flex;

    gap: 12px;

    padding: 12px;

    overflow: hidden;
}

.video-area {

    flex: 1;

    min-width: 0;

    min-height: 0;

    background: #000;

    border-radius: 10px;

    position: relative;

    overflow: hidden;
}

#participantVideoGrid {

    width: 100%;

    height: 100%;

    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(
                240px,
                1fr
            )
        );

    grid-auto-rows:
        minmax(
            180px,
            1fr
        );

    gap: 8px;

    padding: 8px;

    overflow-y: auto;
}

.participant-video-tile {

    position: relative;

    min-height: 180px;

    background: #050505;

    border-radius: 8px;

    overflow: hidden;
}

.participant-video-tile video {

    width: 100%;

    height: 100%;

    object-fit: cover;
}

.local-video-tile {

    border:
        1px solid #374151;
}

.waiting {

    position: absolute;

    inset: 0;

    display: flex;

    align-items: center;

    justify-content: center;

    flex-direction: column;

    color: #6b7280;

    pointer-events: none;
}

.waiting i {

    font-size: 60px;
}

.video-label {

    position: absolute;

    left: 12px;

    bottom: 12px;

    background:
        rgba(0,0,0,.65);

    color: white;

    padding:
        6px 9px;

    border-radius: 5px;

    font-size: 12px;
}

.floating-reaction {

    position: absolute;

    left: 50%;

    bottom: 100px;

    transform:
        translateX(-50%);

    font-size: 65px;

    z-index: 100;

    pointer-events: none;

    animation:
        floatEmoji 2s forwards;
}

.leave-notification {

    position: fixed;

    top: 78px;

    left: 50%;

    transform:
        translateX(-50%)
        translateY(-15px);

    z-index: 9999;

    background:
        rgba(31, 41, 55, .96);

    color: white;

    border:
        1px solid #4b5563;

    border-radius: 10px;

    padding:
        10px 16px;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.35);

    font-size: 13px;

    opacity: 0;

    pointer-events: none;

    transition:
        opacity .25s ease,
        transform .25s ease;
}

.leave-notification.show {

    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

@keyframes floatEmoji {

    0% {

        opacity: 0;

        transform:
            translate(-50%,20px)
            scale(.6);
    }

    15% {

        opacity: 1;
    }

    75% {

        opacity: 1;

        transform:
            translate(-50%,-100px)
            scale(1.1);
    }

    100% {

        opacity: 0;

        transform:
            translate(-50%,-170px)
            scale(1.3);
    }
}

.side {

    width: 330px;

    flex-shrink: 0;

    min-height: 0;

    background: #1f2937;

    border-radius: 10px;

    overflow: hidden;

    display: flex;

    flex-direction: column;

    color: white;
}

.tabs {

    height: 48px;

    display: flex;

    border-bottom:
        1px solid #374151;
}

.tab {

    flex: 1;

    border: none;

    background: transparent;

    color: #9ca3af;

    cursor: pointer;
}

.tab.active {

    color: white;

    border-bottom:
        2px solid #3b82f6;
}

.panel {

    flex: 1;

    min-height: 0;

    overflow-y: auto;

    padding: 12px;
}

.chat-message {

    margin-bottom: 10px;

    font-size: 13px;
}

.chat-name {

    color: #93c5fd;

    font-weight: bold;
}

.chat-text {

    color: #e5e7eb;

    word-break: break-word;
}

.participant-item {

    background: #374151;

    border-radius: 7px;

    padding: 9px;

    margin-bottom: 7px;

    display: flex;

    justify-content: space-between;
}

.question {

    background: #374151;

    border-radius: 7px;

    padding: 10px;

    margin-bottom: 8px;

    font-size: 13px;
}

.question-name {

    color: #93c5fd;

    font-weight: bold;
}

.chat-input {

    border-top:
        1px solid #374151;

    padding: 8px;

    display: flex;

    gap: 6px;
}

.chat-input input {

    flex: 1;

    min-width: 0;

    background: #111827;

    color: white;

    border:
        1px solid #4b5563;
}

.controlbar {

    height: 72px;

    flex-shrink: 0;

    background: #1f2937;

    border-top:
        1px solid #374151;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 8px;

    padding: 8px;
}

.control {

    min-width: 55px;

    height: 50px;

    border: none;

    border-radius: 8px;

    background: #374151;

    color: white;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    cursor: pointer;

    font-size: 11px;
}

.control i {

    font-size: 18px;
}

.control:hover {

    background: #4b5563;
}

.leave {

    background: #dc2626;
}

@media(max-width:850px) {

    .side {

        width: 270px;
    }
}

@media(max-width:650px) {

    .side {

        width: 220px;
    }

    .control {

        min-width: 45px;
    }

    .control span {

        display: none;
    }
}

</style>

</head>

<body>

<div
    id="leaveNotification"
    class="leave-notification"
></div>


<!-- =====================================================
     JOIN
     ===================================================== -->

<div id="joinSection">

    <div class="join-card">

        <div class="text-center mb-3">

            <i
                class="bi bi-camera-video-fill text-primary"
                style="font-size:45px;"
            ></i>

        </div>

        <h3 class="text-center">
            Join Webinar
        </h3>

        <p class="text-center text-muted">
            Enter your name and webinar code.
        </p>

        <input
            id="participantName"
            class="form-control mb-3"
            placeholder="Your name"
        >

        <input
            id="joinCode"
            class="form-control mb-3 text-uppercase"
            placeholder="Webinar code"
        >

        <button
            id="joinButton"
            onclick="joinWebinar()"
            class="btn btn-primary w-100"
        >

            <i class="bi bi-box-arrow-in-right me-2"></i>

            Join Webinar

        </button>

        <div
            id="joinMessage"
            class="mt-3"
        ></div>

    </div>

</div>


<!-- =====================================================
     WEBINAR
     ===================================================== -->

<div
    id="webinarSection"
    style="display:none;"
>

<header class="topbar">

    <div class="brand">

        <i class="bi bi-camera-video-fill"></i>

        LiveConnect

    </div>

    <div class="d-flex align-items-center gap-2">

        <span
            id="webinarTitle"
            class="text-secondary"
        >
            Live Webinar
        </span>

        <span class="live">
            ● LIVE
        </span>

        <span
            id="connectionStatus"
            class="badge bg-warning"
        >
            Connecting
        </span>

    </div>

</header>


<div class="main">


    <!-- VIDEO -->

    <section
        id="videoArea"
        class="video-area"
    >

        <div
            id="participantVideoGrid"
            class="participant-video-grid"
        >

            <div
                id="localVideoTile"
                class="participant-video-tile local-video-tile"
            >

                <video
                    id="localVideo"
                    autoplay
                    muted
                    playsinline
                ></video>

                <div class="video-label">

                    <i class="bi bi-person-video3 me-1"></i>

                    You

                </div>

            </div>


            <div
                id="waiting"
                class="waiting"
            >

                <i class="bi bi-camera-video"></i>

                <h5>
                    Waiting for host video
                </h5>

                <small>
                    Connecting...
                </small>

            </div>

        </div>

    </section>


    <!-- SIDE -->

    <aside class="side">

        <div class="tabs">

            <button
                id="chatTab"
                class="tab active"
                onclick="showPanel('chat')"
            >

                <i class="bi bi-chat me-1"></i>

                Chat

            </button>

            <button
                id="peopleTab"
                class="tab"
                onclick="showPanel('people')"
            >

                <i class="bi bi-people me-1"></i>

                People

            </button>

            <button
                id="pollTab"
                class="tab"
                onclick="showPanel('poll')"
            >

                <i class="bi bi-bar-chart me-1"></i>

                Poll

            </button>

            <button
                id="qaTab"
                class="tab"
                onclick="showPanel('qa')"
            >

                <i class="bi bi-question-circle me-1"></i>

                Q&A

            </button>

        </div>


        <!-- CHAT -->

        <div
            id="chatPanel"
            class="panel"
        >

            <div id="chatList">

                <div
                    id="emptyChat"
                    class="text-secondary text-center small"
                >

                    Waiting for messages...

                </div>

            </div>

        </div>


        <!-- PEOPLE -->

        <div
            id="peoplePanel"
            class="panel"
            style="display:none;"
        >

            <div class="d-flex justify-content-between mb-3">

                <span class="text-secondary">
                    Participants
                </span>

                <span
                    id="participantCount"
                    class="badge bg-primary"
                >
                    0
                </span>

            </div>

            <div id="participantList"></div>

        </div>


        <!-- POLL -->

        <div
            id="pollPanel"
            class="panel"
            style="display:none;"
        >

            <h6 id="pollQuestion">
                Waiting for poll...
            </h6>

            <div id="pollOptions"></div>

            <hr>

            <div
                id="pollResults"
                class="small"
            >
                Vote results will appear here.
            </div>

        </div>


        <!-- Q&A -->

        <div
            id="qaPanel"
            class="panel"
            style="display:none;"
        >

            <textarea
                id="questionInput"
                class="form-control mb-2"
                rows="3"
                placeholder="Ask your question..."
            ></textarea>

            <button
                onclick="askQuestion()"
                class="btn btn-primary btn-sm w-100 mb-3"
            >

                <i class="bi bi-send me-1"></i>

                Ask Question

            </button>

            <div
                id="questionMessage"
                class="small"
            ></div>

            <hr>

            <div id="questionList"></div>

        </div>


        <!-- CHAT INPUT -->

        <div
            id="chatInputArea"
            class="chat-input"
        >

            <input
                id="chatMessage"
                class="form-control form-control-sm"
                placeholder="Type a message..."
                onkeydown="handleChatKey(event)"
            >

            <button
                onclick="sendChat()"
                class="btn btn-primary btn-sm"

                <i class="bi bi-send"></i>

            </button>

        </div>

    </aside>

</div>


<!-- CONTROL -->

<footer class="controlbar">

    <button
        id="muteButton"
        class="control"
        onclick="toggleMute()"
    >

        <i
            id="muteIcon"
            class="bi bi-mic"
        ></i>

        <span id="muteText">
            Mute
        </span>

    </button>

    <button
        id="videoButton"
        class="control"
        onclick="toggleCamera()"
    >

        <i
            id="cameraIcon"
            class="bi bi-camera-video"
        ></i>

        <span id="cameraText">
            Video
        </span>

    </button>

    <button
        id="screenButton"
        class="control"
        onclick="toggleScreenShare()"
    >

        <i class="bi bi-display"></i>

        <span>
            Share

    </button>

    <button
        class="control"
        onclick="sendReaction('👍')"
    >

        👍

        <span>
            Like
        </span>

    </button>

    <button
        class="control"
        onclick="sendReaction('👏')"
    >

        👏

        <span>
            Clap
        </span>

    </button>

    <button
        class="control"
        onclick="sendReaction('❤️')"
    >

        ❤️

        <span>
            Love
        </span>

    </button>

    <button
        class="control"
        onclick="sendReaction('🔥')"
    >

        🔥

        <span>
            Fire
        </span>

    </button>

    <button
        onclick="leaveWebinar()"
        class="control leave"
    >

        <i class="bi bi-box-arrow-right"></i>

        <span>
            Leave
        </span>

    </button>

</footer>

</div>


<script>

// =====================================================
// VARIABLES
// =====================================================

let webinarId = null;

// PHP signaling server
const PHP_BASE_URL = "http://localhost/liveconnect-api";

let participantId = null;

let participantName = null;

let localStream = null;

let screenStream = null;

let microphoneEnabled = true;

let cameraEnabled = true;


// =====================================================
// PHP SIGNALING VARIABLES
// =====================================================

let phpPollTimer = null;

let phpPollTimestamp = 0;

let phpPolling = false;


// =====================================================
// WEBRTC
// =====================================================

let hostPeerConnection = null;

let participantPeerConnections = {};

let participantNames = {};

let pendingHostIceCandidates = [];

let pendingParticipantIceCandidates = {};

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        }

    ]

};


let currentPollId = null;

let hasVoted = false;


// =====================================================
// JOIN
// =====================================================

async function joinWebinar() {

    const name =
        document
            .getElementById(
                "participantName"
            )
            .value
            .trim();

    const code =
        document
            .getElementById(
                "joinCode"
            )
            .value
            .trim()
            .toUpperCase();

    if (
        !name ||
        !code
    ) {

        showJoinMessage(
            "Enter your name and webinar code.",
            "warning"
        );

        return;

    }

    const button =
        document.getElementById(
            "joinButton"
        );

    button.disabled = true;

    const formData =
        new FormData();

    formData.append(
        "name",
        name
    );

    formData.append(
        "join_code",
        code
    );

    try {

        const response =
            await fetch(
                `${PHP_BASE_URL}/join_webinar.php`,
                {
                    method:
                        "POST",

                    body:
                        formData
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            throw new Error(
                data.message ||
                "Unable to join."
            );

        }

        participantId =
            Number(
                data.participant_id
            );

        participantName =
            data.participant_name;

        webinarId =
            data.webinar_id;

        participantNames[
            participantId
        ] =
            participantName;

        document
            .getElementById(
                "webinarTitle"
            )
            .textContent =
            data.webinar_title;

        document
            .getElementById(
                "participantCount"
            )
            .textContent =
            data.participant_count || 0;

        document
            .getElementById(
                "joinSection"
            )
            .style.display =
            "none";

        document
            .getElementById(
                "webinarSection"
            )
            .style.display =
            "flex";

        await startCamera();

        connectPHPSignaling();

    }

    catch (error) {

        button.disabled = false;

        showJoinMessage(
            error.message,
            "danger"
        );

    }

}


// =====================================================
// PARTICIPANT CAMERA
// =====================================================

async function startCamera() {

    try {

        localStream =
            await navigator.mediaDevices.getUserMedia({

                video: true,

                audio: true

            });

    }

    catch (error) {

        console.error(
            "Participant camera:",
            error
        );

        localStream =
            new MediaStream();

    }

    const localVideo =
        document.getElementById(
            "localVideo"
        );

    if (
        localVideo &&
        localStream
    ) {

        localVideo.srcObject =
            localStream;

        localVideo.play().catch(
            function() {}
        );

    }

}


// =====================================================
// PHP SIGNALING
// =====================================================

async function connectPHPSignaling() {

    const status =
        document.getElementById(
            "connectionStatus"
        );

    if (status) {

        status.className =
            "badge bg-warning";

        status.textContent =
            "PHP Connecting...";

    }

    phpPollTimestamp =
        0;

    phpPolling =
        true;

    const result =
        await sendPHPSignal({

            type:
                "participant_ready",

            role:
                "participant",

            participant_id:
                participantId,

            participant_name:
                participantName

        });

    if (
        result &&
        result.success
    ) {

        if (status) {

            status.className =
                "badge bg-success";

            status.textContent =
                "PHP Connected 🟢";

        }

    }
    else {

        if (status) {

            status.className =
                "badge bg-danger";

            status.textContent =
                "PHP Error 🔴";

        }

    }

    pollPHPSignals();

}


// =====================================================
// SEND PHP SIGNAL
// =====================================================

async function sendPHPSignal(
    message
) {

    if (
        !webinarId
    ) {

        return null;

    }

    try {

        const response =
            await fetch(
                `${PHP_BASE_URL}/signal.php`,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            webinar_id:
                                webinarId,

                            sender_id:
                                participantId,

                            ...message

                        })
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            console.error(
                "PHP signal error:",
                data
            );

            return null;

        }

        return data;

    }

    catch (error) {

        console.error(
            "PHP signaling error:",
            error
        );

        return null;

    }

}


// =====================================================
// POLL PHP SIGNALS
// =====================================================

async function pollPHPSignals() {

    if (
        !phpPolling ||
        !webinarId
    ) {

        return;

    }

    try {

        const url =
            `${PHP_BASE_URL}/poll.php?webinar_id=${encodeURIComponent(webinarId)}` +
            `&receiver_id=${encodeURIComponent(participantId)}` +
            `&after=${encodeURIComponent(phpPollTimestamp)}`;

        const response =
            await fetch(
                url,
                {
                    cache:
                        "no-store"
                }
            );

        const data =
            await response.json();

        if (
            data.success
        ) {

            const signals =
                data.signals || [];

            for (
                const signal
                of signals
            ) {

                await handlePHPSignal(
                    signal
                );

            }

            if (
                typeof data.timestamp ===
                "number" &&
                data.timestamp >
                phpPollTimestamp
            ) {

                phpPollTimestamp =
                    data.timestamp;

            }

        }

    }

    catch (error) {

        console.error(
            "PHP polling error:",
            error
        );

    }

    finally {

        if (
            phpPolling
        ) {

            phpPollTimer =
                setTimeout(
                    pollPHPSignals,
                    300
                );

        }

    }

}


// =====================================================
// HANDLE PHP SIGNAL
// =====================================================

async function handlePHPSignal(
    data
) {

    if (
        !data ||
        !data.type
    ) {

        return;

    }


    // ================================================
    // PARTICIPANT ROSTER
    // ================================================

    if (
        data.type ===
        "participant_roster"
    ) {

        const participants =
            data.participants || [];

        for (
            const participant
            of participants
        ) {

            const id =
                Number(
                    participant.participant_id
                );

            if (
                id ===
                participantId
            ) {

                continue;

            }

            participantNames[id] =
                participant.participant_name;

            addParticipant(
                id,
                participant.participant_name
            );

            /*
             * Deterministic offerer:
             * lower participant ID creates offer.
             */

            if (
                participantId <
                id
            ) {

                await createParticipantPeerConnection(
                    id,
                    true
                );

            }

        }

        return;

    }


    // ================================================
    // PARTICIPANT JOINED
    // ================================================

    if (
        data.type ===
        "participant_joined"
    ) {

        const id =
            Number(
                data.participant_id
            );

        if (
            data.participant_count !==
            undefined
        ) {

            document
                .getElementById(
                    "participantCount"
                )
                .textContent =
                data.participant_count;

        }

        if (
            id !==
            participantId
        ) {

            participantNames[id] =
                data.participant_name;

            addParticipant(
                id,
                data.participant_name
            );

        }

        return;

    }


    // ================================================
    // PARTICIPANT READY
    // ================================================

    if (
        data.type ===
        "participant_ready" &&
        data.role ===
        "participant"
    ) {

        const id =
            Number(
                data.participant_id
            );

        if (
            id !==
            participantId
        ) {

            participantNames[id] =
                data.participant_name ||
                participantNames[id] ||
                "Participant";

            addParticipant(
                id,
                participantNames[id]
            );

            if (
                participantId <
                id
            ) {

                await createParticipantPeerConnection(
                    id,
                    true
                );

            }

        }

        return;

    }


    // ================================================
    // HOST OFFER
    // ================================================

    if (
        data.type ===
        "webrtc_offer" &&

        data.role ===
        "host" &&

        data.target_role ===
        "participant"
    ) {

        if (
            Number(
                data.participant_id
            )
            !==
            Number(
                participantId
            )
        ) {

            return;

        }

        await handleHostOffer(
            data.offer
        );

        return;

    }


    // ================================================
    // HOST ICE
    // ================================================

    if (
        data.type ===
        "webrtc_ice" &&

        data.role ===
        "host" &&

        data.target_role ===
        "participant"
    ) {

        if (
            Number(
                data.participant_id
            )
            !==
            Number(
                participantId
            )
        ) {

            return;

        }

        await handleHostIce(
            data.candidate
        );

        return;

    }


    // ================================================
    // HOST ANSWER TO PARTICIPANT
    // ================================================

    if (
        data.type ===
        "webrtc_answer" &&

        data.role ===
        "participant" &&

        data.target_role ===
        "host"
    ) {

        if (
            Number(
                data.participant_id
            )
            !==
            Number(
                participantId
            )
        ) {

            return;

        }

        if (
            hostPeerConnection &&
            data.answer
        ) {

            try {

                await hostPeerConnection.setRemoteDescription(
                    new RTCSessionDescription(
                        data.answer
                    )
                );

            }

            catch (error) {

                console.error(
                    "Host answer error:",
                    error
                );

            }

        }

        return;

    }


    // ================================================
    // PARTICIPANT OFFER
    // ================================================

    if (
        data.type ===
        "webrtc_offer" &&

        data.role ===
        "participant" &&

        data.target_role ===
        "participant"
    ) {

        const fromId =
            Number(
                data.from_participant_id
            );

        const toId =
            Number(
                data.to_participant_id
            );

        if (
            toId !==
            participantId
        ) {

            return;

        }

        if (
            !fromId ||
            fromId ===
            participantId
        ) {

            return;

        }

        participantNames[fromId] =
            data.from_participant_name ||
            participantNames[fromId] ||
            "Participant";

        addParticipant(
            fromId,
            participantNames[fromId]
        );

        await handleParticipantOffer(
            fromId,
            data.offer
        );

        return;

    }


    // ================================================
    // PARTICIPANT ANSWER
    // ================================================

    if (
        data.type ===
        "webrtc_answer" &&

        data.role ===
        "participant" &&

        data.target_role ===
        "participant"
    ) {

        const fromId =
            Number(
                data.from_participant_id
            );

        const toId =
            Number(
                data.to_participant_id
            );

        if (
            toId !==
            participantId
        ) {

            return;

        }

        const pc =
            participantPeerConnections[
                fromId
            ];

        if (
            pc &&
            data.answer
        ) {

            try {

                await pc.setRemoteDescription(
                    new RTCSessionDescription(
                        data.answer
                    )
                );

            }

            catch (error) {

                console.error(
                    "Participant answer error:",
                    error
                );

            }

        }

        return;

    }


    // ================================================
    // PARTICIPANT ICE
    // ================================================

    if (
        data.type ===
        "webrtc_ice"
    ) {

        if (
            data.role ===
            "host" &&
            data.target_role ===
            "participant"
        ) {

            if (
                Number(
                    data.participant_id
                )
                ===
                Number(
                    participantId
                )
            ) {

                await handleHostIce(
                    data.candidate
                );

            }

            return;

        }


        if (
            data.role ===
            "participant" &&
            data.target_role ===
            "participant"
        ) {

            const fromId =
                Number(
                    data.from_participant_id
                );

            const toId =
                Number(
                    data.to_participant_id
                );

            if (
                toId !==
                Number(
                    participantId
                )
            ) {

                return;

            }

            await handleParticipantIce(
                fromId,
                data.candidate
            );

            return;

        }

    }


    // ================================================
    // PARTICIPANT LEFT
    // ================================================

    if (
        data.type ===
        "participant_left"
    ) {

        const id =
            Number(
                data.participant_id
            );

        const name =
            data.participant_name ||
            "Participant";

        if (
            id !==
            Number(
                participantId
            )
        ) {

            delete participantNames[id];

            removeParticipantVideo(
                id
            );

            removeParticipant(
                id
            );

            if (
                data.participant_count !==
                undefined
            ) {

                document
                    .getElementById(
                        "participantCount"
                    )
                    .textContent =
                    data.participant_count;

            }

            showLeaveNotification(
                `${name} left the webinar`
            );

        }

        return;

    }


    // ================================================
    // CHAT
    // ================================================

    if (
        data.type ===
        "chat_message"
    ) {

        addChatMessage(
            data.participant_name,
            data.message,
            data.message_id || null
        );

        return;

    }


    // ================================================
    // REACTION
    // ================================================

    if (
        data.type ===
        "reaction"
    ) {

        addChatMessage(
            data.participant_name,
            `reacted ${data.reaction}`
        );

        showFloatingReaction(
            data.reaction
        );

        return;

    }


    // ================================================
    // POLL
    // ================================================

    if (
        data.type ===
        "poll_created"
    ) {

        showPoll(
            data
        );

        return;

    }


    // ================================================
    // POLL VOTE
    // ================================================

    if (
        data.type ===
        "poll_vote"
    ) {

        addPollResult(
            data
        );

        return;

    }


    // ================================================
    // QUESTION
    // ================================================

    if (
        data.type ===
        "question"
    ) {

        addQuestion(
            data
        );

        return;

    }


    // ================================================
    // QUESTION ANSWERED
    // ================================================

    if (
        data.type ===
        "question_answered"
    ) {

        const message =
            document.getElementById(
                "questionMessage"
            );

        if (message) {

            message.textContent =
                "Question answered by host.";

        }

        const answeredQuestionId =
            Number(
                data.question_id
            );

        if (answeredQuestionId) {

            const questionItem =
                document.querySelector(
                    `[data-question-id="${answeredQuestionId}"]`
                );

            if (questionItem) {

                questionItem.classList.add(
                    "border",
                    "border-success"
                );

                const status =
                    questionItem.querySelector(
                        ".question-status"
                    );

                if (status) {

                    status.textContent =
                        "Answered ✓";

                    status.classList.remove(
                        "text-secondary"
                    );

                    status.classList.add(
                        "text-success"
                    );

                }

            }

        }

        return;

    }

}


// =====================================================
// CREATE HOST PEER CONNECTION
// =====================================================

async function createHostPeerConnection() {

    if (
        hostPeerConnection
    ) {

        return hostPeerConnection;

    }

    hostPeerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );

    addLocalTracks(
        hostPeerConnection
    );


    hostPeerConnection.ontrack =
        function(event) {

            if (
                !event.streams ||
                !event.streams[0]
            ) {

                return;

            }

            createRemoteVideo(
                "host",
                "Host",
                event.streams[0]
            );

            const waiting =
                document.getElementById(
                    "waiting"
                );

            if (waiting) {

                waiting.style.display =
                    "none";

            }

        };


    hostPeerConnection.onicecandidate =
        function(event) {

            if (
                event.candidate
            ) {

                sendPHPSignal({

                    type:
                        "webrtc_ice",

                    role:
                        "participant",

                    target_role:
                        "host",

                    participant_id:
                        participantId,

                    candidate:
                        event.candidate

                });

            }

        };


    hostPeerConnection.onconnectionstatechange =
        function() {

            console.log(
                "Participant -> Host:",
                hostPeerConnection.connectionState
            );

            const state =
                hostPeerConnection.connectionState;

            if (
                state ===
                "connected"
            ) {

                const waiting =
                    document.getElementById(
                        "waiting"
                    );

                if (waiting) {

                    waiting.style.display =
                        "none";

                }

            }

        };


    return hostPeerConnection;

}


// =====================================================
// CREATE PARTICIPANT PEER CONNECTION
// =====================================================

async function createParticipantPeerConnection(
    remoteParticipantId,
    createOffer
) {

    const id =
        Number(
            remoteParticipantId
        );

    if (
        !id ||
        id ===
        Number(
            participantId
        )
    ) {

        return null;

    }


    if (
        participantPeerConnections[id]
    ) {

        if (
            createOffer &&
            participantPeerConnections[id]
                .signalingState ===
                "stable"
        ) {

            await sendParticipantOffer(
                id,
                participantPeerConnections[id]
            );

        }

        return participantPeerConnections[id];

    }


    const pc =
        new RTCPeerConnection(
            rtcConfiguration
        );

    participantPeerConnections[id] =
        pc;


    if (
        !pendingParticipantIceCandidates[id]
    ) {

        pendingParticipantIceCandidates[id] =
            [];

    }


    addLocalTracks(
        pc
    );


    pc.ontrack =
        function(event) {

            if (
                !event.streams ||
                !event.streams[0]
            ) {

                return;

            }

            createRemoteVideo(
                id,
                participantNames[id] ||
                "Participant",
                event.streams[0]
            );

        };


    pc.onicecandidate =
        function(event) {

            if (
                event.candidate
            ) {

                sendPHPSignal({

                    type:
                        "webrtc_ice",

                    role:
                        "participant",

                    target_role:
                        "participant",

                    from_participant_id:
                        participantId,

                    to_participant_id:
                        id,

                    from_participant_name:
                        participantName,

                    candidate:
                        event.candidate

                });

            }

        };


    pc.onconnectionstatechange =
        function() {

            console.log(
                "Participant",
                participantId,
                "-> Participant",
                id,
                ":",
                pc.connectionState
            );

            if (
                pc.connectionState ===
                "failed" ||

                pc.connectionState ===
                "closed"
            ) {

                removeParticipantVideo(
                    id
                );

            }

        };


    if (
        createOffer
    ) {

        await sendParticipantOffer(
            id,
            pc
        );

    }


    return pc;

}


// =====================================================
// ADD LOCAL TRACKS
// =====================================================

function addLocalTracks(
    pc
) {

    if (
        !localStream
    ) {

        return;

    }

    localStream
        .getTracks()
        .forEach(
            function(track) {

                pc.addTrack(
                    track,
                    localStream
                );

            }
        );

}


// =====================================================
// SEND PARTICIPANT OFFER
// =====================================================

async function sendParticipantOffer(
    remoteParticipantId,
    pc
) {

    if (
        !pc ||
        pc.signalingState !==
        "stable"
    ) {

        return;

    }

    try {

        const offer =
            await pc.createOffer();

        await pc.setLocalDescription(
            offer
        );


        sendPHPSignal({

            type:
                "webrtc_offer",

            role:
                "participant",

            target_role:
                "participant",

            from_participant_id:
                participantId,

            to_participant_id:
                Number(
                    remoteParticipantId
                ),

            from_participant_name:
                participantName,

            offer:
                pc.localDescription

        });

    }

    catch (error) {

        console.error(
            "Participant offer error:",
            error
        );

    }

}


// =====================================================
// HANDLE HOST OFFER
// =====================================================

async function handleHostOffer(
    offer
) {

    if (
        !offer
    ) {

        return;

    }


    const pc =
        await createHostPeerConnection();


    try {

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                offer
            )
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        sendPHPSignal({

            type:
                "webrtc_answer",

            role:
                "participant",

            target_role:
                "host",

            participant_id:
                participantId,

            answer:
                pc.localDescription

        });


        const pending =
            pendingHostIceCandidates;


        pendingHostIceCandidates =
            [];


        for (
            const candidate
            of pending
        ) {

            try {

                await pc.addIceCandidate(
                    candidate
                );

            }

            catch (error) {

                console.error(
                    "Pending host ICE:",
                    error
                );

            }

        }

    }

    catch (error) {

        console.error(
            "Host offer error:",
            error
        );

    }

}


// =====================================================
// HANDLE PARTICIPANT OFFER
// =====================================================

async function handleParticipantOffer(
    remoteParticipantId,
    offer
) {

    const id =
        Number(
            remoteParticipantId
        );


    const pc =
        await createParticipantPeerConnection(
            id,
            false
        );


    if (!pc) {

        return;

    }


    try {

        await pc.setRemoteDescription(
            new RTCSessionDescription(
                offer
            )
        );


        const answer =
            await pc.createAnswer();


        await pc.setLocalDescription(
            answer
        );


        sendPHPSignal({

            type:
                "webrtc_answer",

            role:
                "participant",

            target_role:
                "participant",

            from_participant_id:
                participantId,

            to_participant_id:
                id,

            from_participant_name:
                participantName,

            answer:
                pc.localDescription

        });


        const pending =
            pendingParticipantIceCandidates[id] ||
            [];


        pendingParticipantIceCandidates[id] =
            [];


        for (
            const candidate
            of pending
        ) {

            try {

                await pc.addIceCandidate(
                    candidate
                );

            }

            catch (error) {

                console.error(
                    "Pending participant ICE:",
                    error
                );

            }

        }

    }

    catch (error) {

        console.error(
            "Participant offer error:",
            error
        );

    }

}


// =====================================================
// HANDLE HOST ICE
// =====================================================

async function handleHostIce(
    candidateData
) {

    if (
        !candidateData
    ) {

        return;

    }


    const candidate =
        new RTCIceCandidate(
            candidateData
        );


    if (
        hostPeerConnection &&
        hostPeerConnection.remoteDescription
    ) {

        try {

            await hostPeerConnection.addIceCandidate(
                candidate
            );

        }

        catch (error) {

            console.error(
                "Host ICE error:",
                error
            );

        }

    }

    else {

        pendingHostIceCandidates.push(
            candidate
        );

    }

}


// =====================================================
// HANDLE PARTICIPANT ICE
// =====================================================

async function handleParticipantIce(
    remoteParticipantId,
    candidateData
) {

    if (
        !candidateData ||
        !remoteParticipantId
    ) {

        return;

    }


    const id =
        Number(
            remoteParticipantId
        );


    const candidate =
        new RTCIceCandidate(
            candidateData
        );


    const pc =
        participantPeerConnections[id];


    if (
        pc &&
        pc.remoteDescription
    ) {

        try {

            await pc.addIceCandidate(
                candidate
            );

        }

        catch (error) {

            console.error(
                "Participant ICE error:",
                error
            );

        }

    }

    else {

        if (
            !pendingParticipantIceCandidates[id]
        ) {

            pendingParticipantIceCandidates[id] =
                [];

        }

        pendingParticipantIceCandidates[id]
            .push(
                candidate
            );

    }

}


// =====================================================
// REMOTE VIDEO TILE
// =====================================================

function createRemoteVideo(
    remoteId,
    name,
    stream
) {

    const tileId =
        remoteId === "host"
            ? "remote-video-host"
            : `remote-video-${remoteId}`;


    let tile =
        document.getElementById(
            tileId
        );


    if (!tile) {

        tile =
            document.createElement(
                "div"
            );

        tile.className =
            "participant-video-tile";

        tile.id =
            tileId;

        tile.innerHTML =
            `
            <video
                autoplay
                playsinline
            ></video>

            <div class="video-label">

                <i class="bi bi-person me-1"></i>

                ${escapeHtml(name)}

            </div>
            `;


        document
            .getElementById(
                "participantVideoGrid"
            )
            .appendChild(
                tile
            );

    }


    const video =
        tile.querySelector(
            "video"
        );


    if (
        video.srcObject !==
        stream
    ) {

        video.srcObject =
            stream;

        video.play().catch(
            function() {}
        );

    }

}


// =====================================================
// REMOVE REMOTE VIDEO
// =====================================================

function removeParticipantVideo(
    remoteId
) {

    const tileId =
        remoteId === "host"
            ? "remote-video-host"
            : `remote-video-${remoteId}`;


    const tile =
        document.getElementById(
            tileId
        );


    if (tile) {

        tile.remove();

    }


    if (
        remoteId !==
        "host"
    ) {

        const id =
            Number(
                remoteId
            );


        if (
            participantPeerConnections[id]
        ) {

            participantPeerConnections[id].close();

        }


        delete participantPeerConnections[id];

        delete pendingParticipantIceCandidates[id];

    }

}


// =====================================================
// REMOVE HOST CONNECTION
// =====================================================

function removeHostConnection() {

    const tile =
        document.getElementById(
            "remote-video-host"
        );


    if (tile) {

        tile.remove();

    }


    if (
        hostPeerConnection
    ) {

        hostPeerConnection.close();

    }


    hostPeerConnection =
        null;

}


// =====================================================
// PARTICIPANT LIST
// =====================================================

function addParticipant(

    name
) {

    const list =

        </span>
        `;


    list.appendChild(
        item
    );

}


// =====================================================
// SCREEN SHARE
// =====================================================

async function toggleScreenShare() {

    if (
        screenStream
    ) {

        stopScreenShare();

        return;

    }


    try {

        screenStream =
            await navigator.mediaDevices.getDisplayMedia({

                video: true,

                audio: true

            });


        const screenTrack =
            screenStream.getVideoTracks()[0];


        const allPeerConnections =
            [];


        if (
            hostPeerConnection
        ) {

            allPeerConnections.push(
                hostPeerConnection
            );

        }


        Object.values(
            participantPeerConnections
        ).forEach(
            function(pc) {

                allPeerConnections.push(
                    pc
                );

            }
        );


        allPeerConnections.forEach(
            function(pc) {

                const sender =
                    pc
                        .getSenders()
                        .find(
                            function(sender) {

                                return (
                                    sender.track &&
                                    sender.track.kind ===
                                    "video"
                                );

                            }
                        );


                if (sender) {

                    sender.replaceTrack(
                        screenTrack
                    );

                }

            }
        );


        screenTrack.onended =
            function() {

                stopScreenShare();

            };

    }

    catch (error) {

        console.error(
            "Screen share:",
            error
        );

    }

}


// =====================================================
// STOP SCREEN SHARE
// =====================================================

function stopScreenShare() {

    if (
        !screenStream
    ) {

        return;

    }


    screenStream
        .getTracks()
        .forEach(
            function(track) {

                track.stop();

            }
        );


    const cameraTrack =
        localStream
            ?.getVideoTracks()[0];


    if (
        cameraTrack
    ) {

        const allPeerConnections =
            [];


        if (
            hostPeerConnection
        ) {

            allPeerConnections.push(
                hostPeerConnection
            );

        }


        Object.values(
            participantPeerConnections
        ).forEach(
            function(pc) {

                allPeerConnections.push(
                    pc
                );

            }
        );


        allPeerConnections.forEach(
            function(pc) {

                const sender =
                    pc
                        .getSenders()
                        .find(
                            function(sender) {

                                return (
                                    sender.track &&
                                    sender.track.kind ===
                                    "video"
                                );

                            }
                        );


                if (sender) {

                    sender.replaceTrack(
                        cameraTrack
                    );

                }

            }
        );

    }


    screenStream =
        null;

}


// =====================================================
// CHAT
// =====================================================

async function sendChat() {

    const input =
        document.getElementById(
            "chatMessage"
        );

    const message =
        input.value.trim();

    if (!message) {
        return;
    }

    if (
        !participantId ||
        !webinarId
    ) {

        alert(
            "Participant session is not ready."
        );

        return;
    }

    try {

        const params =
            new URLSearchParams();

        params.append(
            "participant_id",
            participantId
        );

        params.append(
            "webinar_id",
            webinarId
        );

        params.append(
            "message",
            message
        );

        const response =
            await fetch(
                `${PHP_BASE_URL}/chat.php`,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded; charset=UTF-8"
                    },

                    body:
                        params.toString()
                }
            );

        const data =
            await response.json();

        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Message could not be sent."
            );

            return;
        }

        /*
         * Show the message immediately for the sender.
         */
        addChatMessage(
            participantName,
            message,
            data.message_id
        );

        await sendPHPSignal({

            type:
                "chat_message",

            participant_name:
                participantName,

            message:
                message,

            message_id:
                data.message_id

        });

        input.value =
            "";

    }

    catch (error) {

        console.error(
            "Chat:",
            error
        );

        alert(
            "Unable to send message."
        );

    }

}


function handleChatKey(
    event
) {

    if (
        event.key ===
        "Enter"
    ) {

        sendChat();

    }

}


// =====================================================
// CHAT DISPLAY
// =====================================================

function addChatMessage(
    name,
    message,
    messageId = null
) {

    const list =
        document.getElementById(
            "chatList"
        );

    const empty =
        document.getElementById(
            "emptyChat"
        );

    if (messageId) {

        const existing =
            list.querySelector(
                `[data-message-id="${messageId}"]`
            );

        if (existing) {
            return;
        }

    }

    if (empty) {
        empty.remove();
    }

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "chat-message";

    if (messageId) {
        item.dataset.messageId =
            messageId;
    }

    item.innerHTML =
        `
        <div class="chat-name">
            ${escapeHtml(name)}
        </div>

        <div class="chat-text">
            ${escapeHtml(message)}
        </div>
        `;

    list.appendChild(
        item
    );

    list.scrollTop =
        list.scrollHeight;

}


// =====================================================
// REACTION
// =====================================================

async function sendReaction(
    reaction
) {

    if (
        !participantId ||
        !webinarId
    ) {

        return;

    }


    try {

        const params =
            new URLSearchParams();


        params.append(
            "participant_id",
            participantId
        );


        params.append(
            "webinar_id",
            webinarId
        );


        params.append(
            "reaction",
            reaction
        );


        const response =
            await fetch(
                `${PHP_BASE_URL}/react.php`,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded; charset=UTF-8"
                    },

                    body:
                        params.toString()
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Reaction could not be sent."
            );

            return;

        }


        await sendPHPSignal({

            type:
                "reaction",

            participant_name:
                participantName,

            reaction:
                reaction

        });

        showFloatingReaction(
            reaction
        );

    }

    catch (error) {

        console.error(
            "Reaction:",
            error
        );


        alert(
            "Unable to send reaction."
        );

    }

}


// =====================================================
// FLOATING REACTION
// =====================================================

function showFloatingReaction(
    reaction
) {

    const area =
        document.getElementById(
            "videoArea"
        );


    const emoji =
        document.createElement(
            "div"
        );


    emoji.className =
        "floating-reaction";


    emoji.textContent =
        reaction;


    area.appendChild(
        emoji
    );


    setTimeout(
        function() {

            emoji.remove();

        },
        2100
    );

}


// =====================================================
// POLL
// =====================================================

function showPoll(
    data
) {

    currentPollId =
        data.poll_id;


    hasVoted =
        false;


    document
        .getElementById(
            "pollQuestion"
        )
        .textContent =
        data.question;


    const options =
        document.getElementById(
            "pollOptions"
        );


    options.innerHTML =
        "";


    document
        .getElementById(
            "pollResults"
        )
        .innerHTML =
        "";


    if (
        !data.options
    ) {

        return;

    }


    data.options.forEach(
        function(option) {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "btn btn-outline-primary w-100 mb-2";


            button.textContent =
                option.text ||
                option.option_text ||
                "";


            button.onclick =
                function() {

                    votePoll(
                        data.poll_id,
                        option.id
                    );

                };


            options.appendChild(
                button
            );

        }
    );


    showPanel(
        "poll"
    );

}


async function votePoll(
    pollId,
    optionId
) {

    if (
        hasVoted
    ) {

        return;

    }


    const params =
        new URLSearchParams();


    params.append(
        "poll_id",
        pollId
    );


    params.append(
        "option_id",
        optionId
    );


    params.append(
        "participant_id",
        participantId
    );


    try {

        const response =
            await fetch(
                `${PHP_BASE_URL}/vote_poll.php`,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded; charset=UTF-8"
                    },

                    body:
                        params.toString()
                }
            );


        const data =
            await response.json();


        if (
            !response.ok ||
            !data.success
        ) {

            alert(
                data.message ||
                "Unable to vote."
            );

            return;

        }


        hasVoted =
            true;


        document
            .querySelectorAll(
                "#pollOptions button"
            )
            .forEach(
                function(button) {

                    button.disabled =
                        true;

                }
            );


        await sendPHPSignal({

            type:
                "poll_vote",

            poll_id:
                pollId,

            option_id:
                optionId,

            vote_count:
                data.vote_count || 0,

            participant_name:
                participantName

        });

        document
            .getElementById(
                "pollResults"
            )
            .textContent =
            "Your vote was recorded ✅";

    }

    catch (error) {

        console.error(
            "Poll:",
            error
        );

    }

}


function addPollResult(
    data
) {

    const results =
        document.getElementById(
            "pollResults"
        );


    const item =
        document.createElement(
            "div"
        );


    item.textContent =
        `${data.participant_name}: ${data.vote_count} vote(s)`;


    results.appendChild(
        item
    );

}


// =====================================================
// Q&A
// =====================================================

async function askQuestion() {

    const input =
        document.getElementById(
            "questionInput"
        );


    const question =
        input.value.trim();


    if (
        !question
    ) {

        return;

    }


    const params =
        new URLSearchParams();


    params.append(
        "participant_id",
        participantId
    );


    params.append(
        "question",
        question
    );


    try {

        params.append(
            "webinar_id",
            webinarId
        );

        const response =
            await fetch(
                `${PHP_BASE_URL}/question.php`,
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded; charset=UTF-8"
                    },

                    body:
                        params.toString()
                }
            );


        const data =
            await response.json();


        document
            .getElementById(
                "questionMessage"
            )
            .textContent =
            data.message;


        if (
            data.success
        ) {

            addQuestion({

                question_id:
                    data.question_id,

                participant_name:
                    participantName,

                question:
                    question

            });

            await sendPHPSignal({

                type:
                    "question",

                question_id:
                    data.question_id,

                participant_id:
                    participantId,

                participant_name:
                    participantName,

                question:
                    question

            });

            input.value =
                "";

        }

    }

    catch (error) {

        console.error(
            "Question:",
            error
        );


        document
            .getElementById(
                "questionMessage"
            )
            .textContent =
            "Unable to submit question.";

    }

}


// =====================================================
// QUESTIONS
// =====================================================

function addQuestion(
    data
) {

    const list =
        document.getElementById(
            "questionList"
        );

    if (
        data.question_id
    ) {

        const existing =
            list.querySelector(
                `[data-question-id="${data.question_id}"]`
            );

        if (existing) {
            return;
        }

    }

    const item =
        document.createElement(
            "div"
        );

    item.className =
        "question";

    if (
        data.question_id
    ) {

        item.dataset.questionId =
            data.question_id;

    }

    item.innerHTML =
        `
        <div class="d-flex justify-content-between align-items-start">

            <div class="question-name">
                ${escapeHtml(data.participant_name)}
            </div>

            <span class="question-status text-secondary small">
                Pending
            </span>

        </div>

        <div>
            ${escapeHtml(data.question)}
        </div>
        `;

    list.prepend(
        item
    );

}


// =====================================================
// MUTE
// =====================================================

function toggleMute() {

    if (
        !localStream
    ) {

        return;

    }


    localStream
        .getAudioTracks()
        .forEach(
            function(track) {

                track.enabled =
                    !track.enabled;

                microphoneEnabled =
                    track.enabled;

            }
        );


    document
        .getElementById(
            "muteIcon"
        )
        .className =
        microphoneEnabled
            ? "bi bi-mic"
            : "bi bi-mic-mute";


    document
        .getElementById(
            "muteText"
        )
        .textContent =
        microphoneEnabled
            ? "Mute"
            : "Unmute";

}


// =====================================================
// CAMERA
// =====================================================

function toggleCamera() {

    if (
        !localStream
    ) {

        return;

    }


    localStream
        .getVideoTracks()
        .forEach(
            function(track) {

                track.enabled =
                    !track.enabled;

                cameraEnabled =
                    track.enabled;

            }
        );


    document
        .getElementById(
            "cameraIcon"
        )
        .className =
        cameraEnabled
            ? "bi bi-camera-video"
            : "bi bi-camera-video-off";


    document
        .getElementById(
            "cameraText"
        )
        .textContent =
        cameraEnabled
            ? "Video"
            : "Start Video";

}


// =====================================================
// REMOVE PARTICIPANT
// =====================================================

function removeParticipant(
    id
) {

    const item =
        document.querySelector(
            `[data-participant-id="${id}"]`
        );


    if (item) {

    }

// =====================================================
// LEAVE NOTIFICATION
// =====================================================

function showLeaveNotification(
    message
) {

    const notification =
        document.getElementById(
            "leaveNotification"
        );


    if (!notification) {

        return;

    }


    notification.textContent =
        `🔔 ${message}`;


    notification.classList.add(
        "show"
    );


    clearTimeout(
        window.leaveNotificationTimer
    );


    window.leaveNotificationTimer =
        setTimeout(
            function() {

                notification.classList.remove(
                    "show"
                );

            },
            3000
        );

}


// =====================================================
// PANELS
// =====================================================

function showPanel(
    panel
) {

    const panels = {

        chat:
            document.getElementById(
                "chatPanel"
            ),

        people:
            document.getElementById(
                "peoplePanel"
            ),

        poll:
            document.getElementById(
                "pollPanel"
            ),

        qa:
            document.getElementById(
                "qaPanel"
            )

    };


    const tabs = {

        chat:
            document.getElementById(
                "chatTab"
            ),

        people:
            document.getElementById(
                "peopleTab"
            ),

        poll:
            document.getElementById(
                "pollTab"
            ),

        qa:
            document.getElementById(
                "qaTab"
            )

    };


    Object.values(
        panels
    ).forEach(
        function(panelElement) {

            panelElement.style.display =
                "none";

        }
    );


    Object.values(
        tabs
    ).forEach(
        function(tabElement) {

            tabElement.classList.remove(
                "active"
            );

        }
    );


    panels[
        panel
    ].style.display =
        "block";


    tabs[
        panel
    ].classList.add(
        "active"
    );


    document
        .getElementById(
            "chatInputArea"
        )
        .style.display =
        panel === "chat"
            ? "flex"
            : "none";

}


// =====================================================
// LEAVE
// =====================================================

function leaveWebinar() {

    phpPolling =
        false;


    if (
        phpPollTimer
    ) {

        clearTimeout(
            phpPollTimer
        );

        phpPollTimer =
            null;

    }


    /*
     * Tell PHP signaling system that the
     * participant is leaving.
     */

    sendPHPSignal({

        type:
            "participant_left",

        role:
            "participant",

        participant_id:
            participantId,

        participant_name:
            participantName

    });


    if (
        hostPeerConnection
    ) {

        hostPeerConnection.close();

    }


    hostPeerConnection =
        null;


    Object.values(
        participantPeerConnections
    ).forEach(
        function(pc) {

            pc.close();

        }
    );


    participantPeerConnections =
        {};


    if (
        screenStream
    ) {

        screenStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        screenStream =
            null;

    }


    if (
        localStream
    ) {

        localStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        localStream =
            null;

    }


    setTimeout(
        function() {

            window.location.reload();

        },
        150
    );

}


// =====================================================
// JOIN MESSAGE
// =====================================================

function showJoinMessage(
    message,
    type
) {

    document
        .getElementById(
            "joinMessage"
        )
        .innerHTML =
        `
        <div class="alert alert-${type}">
            ${escapeHtml(message)}
        </div>
        `;

}


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHtml(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value ?? "";


    return div.innerHTML;

}
